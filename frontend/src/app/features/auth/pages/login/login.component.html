<main class="login-wrapper">
  <section class="login-card" aria-labelledby="login-title">
    <header class="login-brand">
      <img src="/design-system/logo-symbol.png" alt="" width="44" height="44">
      <div>
        <h1 class="brand-name">Unical <b>Support</b></h1>
        <p class="brand-subtitle">STUDENT SERVICES</p>
      </div>
    </header>

    <div class="login-intro">
      <h2 id="login-title">Accedi al tuo spazio di lavoro</h2>
      <p>Usa le tue credenziali per continuare.</p>
    </div>

    <form class="login-form" (ngSubmit)="submit()" [attr.aria-busy]="loading()">
      @if (error()) {
        <p class="login-error" role="alert">{{ error() }}</p>
      }

      <div class="form-group">
        <label for="login-email" class="form-label">Email</label>
        <input id="login-email" type="email" name="email" [(ngModel)]="email" class="form-control"
          autocomplete="username" [disabled]="loading()" required>
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <input id="login-password" type="password" name="password" [(ngModel)]="password" class="form-control"
          autocomplete="current-password" [disabled]="loading()" required>
      </div>

      <button type="submit" class="btn btn-primary login-submit" [disabled]="loading() || !email || !password">
        {{ loading() ? 'Accesso in corso...' : 'Accedi' }}
      </button>
    </form>
  </section>
</main>
