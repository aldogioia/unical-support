<dialog #modal class="modal-dialog">
  @if (email) {
    <div class="modal-content">
      <!-- Header -->
      <div class="modal-header">
        <div>
          <h2 class="modal-title">Rivedi la risposta</h2>
          <p class="modal-subtitle">Mittente: {{email.sender}}</p>
        </div>
        <button (click)="close()" class="icon-btn" aria-label="Chiudi">
          <svg class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Split Layout -->
      <div class="modal-body">
        <!-- Context Area (Read Only) -->
        <div class="modal-context">
          <div class="info-group">
            <h3 class="info-label">Oggetto</h3>
            <p class="info-value">{{ email.subject }}</p>
          </div>
          <div class="info-group">
            <h3 class="info-label">Richiesta originale</h3>
            <div class="info-value pre-wrap">{{ email.body }}</div>
          </div>
        </div>

        <!-- Edit Area -->
        <div class="modal-edit">
          <h3 class="info-label">Bozza della risposta</h3>
          <textarea 
            [(ngModel)]="editableDraft" 
            class="form-control flex-1 resize-none"
            placeholder="Scrivi qui la risposta..."
          ></textarea>
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="modal-footer">
        <button (click)="onEscalate()" class="btn btn-danger">
          Richiedi gestione manuale
        </button>
        <button (click)="onApprove()" class="btn btn-primary shadow-sm">
          Approva e invia
        </button>
      </div>
    </div>
  }
</dialog>
