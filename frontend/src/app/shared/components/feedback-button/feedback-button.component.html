<!-- Feedback Dialog -->
<dialog
  #feedbackDialog
  class="feedback-dialog"
  aria-labelledby="feedback-title"
>
  <div class="feedback-modal-content">
    <!-- Header -->
    <div class="feedback-modal-header">
      <h2 id="feedback-title" class="feedback-modal-title">
        Invia una segnalazione
      </h2>
      <button
        class="feedback-close-btn"
        aria-label="Chiudi segnalazione"
        (click)="closeDialog()"
        [disabled]="loading"
      >
        <ds-icon name="close" />
      </button>
    </div>

    <!-- Success View -->
    <div *ngIf="success" class="feedback-success-view">
      <div class="feedback-success-icon">
        <ds-icon name="check" />
      </div>
      <p class="feedback-success-message">
        Grazie! La tua segnalazione è stata inviata.
      </p>
    </div>

    <!-- Main Form View -->
    <form
      *ngIf="!success"
      (submit)="submitFeedback($event)"
      class="feedback-form"
    >
      <div class="feedback-modal-body">
        <!-- Error Message -->
        <div *ngIf="errorMsg" class="feedback-error-banner">
          {{ errorMsg }}
        </div>

        <!-- Description Form Group -->
        <div class="form-group">
          <label for="feedback-desc" class="form-label"
            >Descrizione del problema o suggerimento *</label
          >
          <textarea
            id="feedback-desc"
            class="form-control feedback-textarea"
            [(ngModel)]="description"
            name="description"
            placeholder="Descrivi in dettaglio cosa stavi facendo o come possiamo migliorare..."
            required
            [disabled]="loading"
            rows="4"
          >
          </textarea>
        </div>

        <!-- Screenshot Attachment Toggle -->
        <div *ngIf="screenshotUrl" class="feedback-screenshot-group">
          <label class="check-radio-group">
            <input
              type="checkbox"
              class="check-radio-input"
              [(ngModel)]="attachScreenshot"
              name="attachScreenshot"
              [disabled]="loading"
            />
            <span class="form-label feedback-checkbox-label"
              >Allega un’immagine della schermata corrente</span
            >
          </label>

          <!-- Screenshot Preview -->
          <div *ngIf="attachScreenshot" class="feedback-preview-container">
            <img
              [src]="screenshotUrl"
              alt="Anteprima della schermata"
              class="feedback-screenshot-preview"
            />
          </div>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="feedback-modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="closeDialog()"
          [disabled]="loading"
        >
          Annulla
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loading || !description.trim()"
        >
          <span *ngIf="loading">Invio in corso...</span>
          <span *ngIf="!loading">Invia segnalazione</span>
        </button>
      </div>
    </form>
  </div>
</dialog>
