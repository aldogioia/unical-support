services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTA SICUREZZA: Nessuna porta 5432 esposta all'esterno!

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # NOTA SICUREZZA: Nessuna porta 6379 esposta all'esterno!

  backend:
    build:
      context: .
      target: backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - shared_uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FEEDBACK_EMAIL_SENDER=${FEEDBACK_EMAIL_SENDER}
      - FEEDBACK_EMAIL_PASSWORD=${FEEDBACK_EMAIL_PASSWORD}
      - FEEDBACK_EMAIL_RECIPIENT=${FEEDBACK_EMAIL_RECIPIENT}
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      target: worker
    restart: always
    command: celery -A app.core.celery_app worker -Q polling_queue,classify_queue,respond_queue,document_queue -l INFO --concurrency=2
    volumes:
      - shared_uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
      target: backend
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  shared_uploads:
