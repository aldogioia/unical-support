services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTA SICUREZZA: Nessuna porta 5432 esposta all'esterno!

  redis:
    image: redis:7-alpine
    restart: always
    entrypoint: sh -c "exec redis-server --requirepass \$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    # NOTA SICUREZZA: Nessuna porta 6379 esposta all'esterno!

  backend:
    build:
      context: .
      target: backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - shared_uploads:/app/uploads
    secrets:
      - database_url
      - redis_url
      - secret_key
      - groq_api_key
      - google_api_key
      - google_api_key_2
      - feedback_email_sender
      - feedback_email_password
      - feedback_email_recipient
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      target: worker
    restart: always
    command: celery -A app.core.celery_app worker -Q polling_queue,classify_queue,respond_queue,document_queue -l INFO --concurrency=2
    volumes:
      - shared_uploads:/app/uploads
    secrets:
      - database_url
      - redis_url
      - groq_api_key
      - google_api_key
      - google_api_key_2
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
      target: backend
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    secrets:
      - database_url
      - redis_url
      - groq_api_key
      - google_api_key
      - google_api_key_2
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  shared_uploads:

secrets:
  postgres_user:
    file: /home/operatore/secrets/postgres_user
  postgres_password:
    file: /home/operatore/secrets/postgres_password
  postgres_db:
    file: /home/operatore/secrets/postgres_db
  redis_password:
    file: /home/operatore/secrets/redis_password
  database_url:
    file: /home/operatore/secrets/database_url
  redis_url:
    file: /home/operatore/secrets/redis_url
  secret_key:
    file: /home/operatore/secrets/secret_key
  groq_api_key:
    file: /home/operatore/secrets/groq_api_key
  google_api_key:
    file: /home/operatore/secrets/google_api_key
  google_api_key_2:
    file: /home/operatore/secrets/google_api_key_2
  feedback_email_sender:
    file: /home/operatore/secrets/feedback_email_sender
  feedback_email_password:
    file: /home/operatore/secrets/feedback_email_password
  feedback_email_recipient:
    file: /home/operatore/secrets/feedback_email_recipient